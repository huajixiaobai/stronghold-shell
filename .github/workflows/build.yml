name: Build APK

on:
  workflow_dispatch:            # 手动触发
    inputs:
      version:                  # 可选：指定上游版本号（不填则自动查最新）
        description: '上游版本号，如 0.2.5（留空=自动取最新）'
        required: false
        default: ''
  push:
    tags: ['v*']                # 打 v* 标签时自动构建

permissions:
  contents: write               # 允许创建 Release 并上传 asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注：ubuntu-latest runner 已预装 Android SDK，直接用，无需 setup-android
      - name: 显示环境
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head
          which gradle && gradle --version || echo "未找到全局 gradle"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 下载 libnode.so 到 jniLibs（不把 60MB 二进制存进仓库）
      - name: 准备 libnode.so
        run: bash scripts/fetch_libnode.sh

      # ⭐ 启动器模式：不再内置游戏包（APK 体积小、不含素材，合规）
      #    游戏内容由用户自行导入上游完整包 zip。
      - name: 版本号（启动器版本）
        id: ver
        run: |
          # 手动触发时以输入为准；否则从 app/build.gradle.kts 读 stable 变体的 versionName
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            # productFlavors 里有两个 versionName，取第一个（stable 的 2.0.1）
            V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          fi
          V="${V:-1.0.0}"
          V="${V#v}"   # 去掉可能的 v 前缀，避免出现 vv
          [ -n "$V" ] || V="1.0.0"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "启动器版本 = $V"

      # ⚠️ 2026-10 起 ubuntu-latest 镜像自带全局 Gradle 已升到 9.x，
      #    而本项目 AGP 8.5.2 只支持 Gradle 8.x（AGP 用到的 InternalProblems
      #    内部 API 在 Gradle 9.6 被移除）。原来的写法是直接用全局 gradle 跑
      #    `gradle wrapper --gradle-version 8.7`，但这条命令会**先配置整个项目**
      #    （解析 settings.gradle.kts → 加载 AGP），于是在配置阶段就炸了，
      #    `--gradle-version 8.7` 根本来不及生效。
      #    改为在临时空目录里生成 wrapper，完全不触碰本项目的构建脚本。
      - name: 生成 Gradle Wrapper（若缺失）
        run: |
          if [ ! -f ./gradlew ]; then
            echo "==> gradlew 缺失，在临时空目录生成 wrapper（避免用 Gradle 9 配置本项目）"
            TMP=$(mktemp -d)
            echo 'rootProject.name = "wrapper-gen"' > "$TMP/settings.gradle.kts"
            ( cd "$TMP" && gradle wrapper --gradle-version 8.7 --distribution-type bin )
            cp "$TMP/gradlew" "$TMP/gradlew.bat" .
            mkdir -p gradle/wrapper
            cp "$TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            rm -rf "$TMP"
          fi
          chmod +x ./gradlew
          ./gradlew --version

      # ⭐ 固定签名：从 Secrets 还原 keystore，保证每次构建签名的证书一致，
      #    这样后续版本可以「覆盖升级」而不必卸载（不丢已导入的游戏包）。
      - name: 准备签名 keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 KEYSTORE_B64，将回退到 debug 签名（每次构建签名都会变！）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/stronghold.jks
          ls -lh app/stronghold.jks
          echo "keystore 已还原"

      - name: 构建 Release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 项目有两个构建变体：stable（正式）/ lab（联机实验）
          # 同时产出两个 APK，包名不同可并存
          ./gradlew :app:assembleStableRelease :app:assembleLabRelease --stacktrace --no-daemon

      - name: 收集 APK 并正式命名
        id: apk
        run: |
          V="${{ steps.ver.outputs.version }}"
          NAME="StrongholdShell-launcher-v${V}-android.apk"
          LAB_NAME="StrongholdShell-launcher-v${V}-lab-android.apk"
          mkdir -p out
          # stable 版（正式，不含联机入口）
          cp app/build/outputs/apk/stable/release/*.apk "out/${NAME}"
          # lab 版（联机实验，独立包名 com.stronghold.shell.lab）
          if ls app/build/outputs/apk/lab/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/lab/release/*.apk "out/${LAB_NAME}"
          fi
          ls -lh out/
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "lab_name=$LAB_NAME" >> "$GITHUB_OUTPUT"
          # 记录 SHA-256，写进 Release 说明
          SHA=$(sha256sum "out/${NAME}" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$NAME SHA-256: $SHA"
          if [ -f "out/${LAB_NAME}" ]; then
            LAB_SHA=$(sha256sum "out/${LAB_NAME}" | cut -d' ' -f1)
            echo "lab_sha256=$LAB_SHA" >> "$GITHUB_OUTPUT"
            echo "$LAB_NAME SHA-256: $LAB_SHA"
          fi

      - name: 对齐与签名校验
        run: |
          # 硬性要求：4 字节对齐 + .so 4KB 页对齐
          ZA="${ANDROID_HOME}/build-tools/34.0.0/zipalign"
          AS="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          for f in out/*.apk; do
            echo "=== $f ==="
            "$ZA" -c -v -p 4 "$f" | tail -3 || echo "::error::zipalign 校验失败 $f"
            "$AS" verify --verbose "$f" | head -6 || echo "::error::签名校验失败 $f"
          done

      - name: 上传 APK 产物（备份）
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-shell-launcher-apk
          path: out/*.apk
          if-no-files-found: error

      # ⚠️ 发布说明里的「本版修复」需要每次发版手动更新：
      #    版本号不是重点，用户要看的是「这次修了什么问题」。
      #    写清「修了什么现象 → 为什么会这样 → 现在怎么表现」，别只写"优化体验"。
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v${{ steps.ver.outputs.version }}
          # ⚠️ 不写这一行，tag 会落在仓库默认分支（main）的最新提交上，
          #    而不是这次实际构建的分支 —— 表现就是 Release 页的源码链接
          #    指向 main 的老代码。github.sha 是本次检出到的那个提交。
          target_commitish: ${{ github.sha }}
          name: 卫戍协议启动器 v${{ steps.ver.outputs.version }}
          body: |
            **《卫戍协议：盟约》安卓启动器** —— 不含游戏内容的空壳，导入上游完整包即可游玩。

            ## 本版修复（v2.0.3）

            **联机提示不再误报、不再刷屏**

            - 之前玩一会儿就来回弹「未连接 / 已连接」，其实连接一直是好的。
              原因是游戏前端自带自动重连，每次重连都会产生一次断开+连上的事件，
              旧逻辑逐条弹提示；页面里同时开着多条 WebSocket 时，旧连接正常关闭
              也会被当成联机断开。
            - 现在按连接记账，只有全部连接都断了才算掉线；首次连上提示一次，
              之后的重连全部静默；真的掉线超过 10 秒才提示一次「联机已断开」，
              恢复后提示一次「已重新连上」。
            - 提示停留时间由 3.5 秒缩短到 2 秒，不再挡视线。
            - 移除了游戏画面上常驻的调试横幅，不再遮挡 HUD。

            **服务器地址更好填**

            - 域名不再强制补 `:3000`。挂在 Cloudflare / Nginx 后面的域名只开放
              80/443，补 3000 会一直连不上。现在：域名默认 80，局域网 IP 默认 3000，
              显式写的端口优先；端口就是协议默认值时不再显示出来。
            - 支持 IPv6 地址，例如 `[240c:cb02::1]:3000`。
            - 支持 `https://` / `wss://` 加密连接，填了 443 端口也会自动走加密。

            **首次启动黑屏**

            - 修复 Node 服务端口还没就绪、WebView 抢跑导致的黑底错误页。
              现在会退到「正在启动游戏…」并自动重试，正常 3 秒进标题页。

            ## 本次包含两个 APK

            | 文件 | 包名 | 说明 |
            |---|---|---|
            | `${{ steps.apk.outputs.name }}` | `com.stronghold.shell` | **正式版**。功能与之前一致，不含联机入口。 |
            | `${{ steps.apk.outputs.lab_name }}` | `com.stronghold.shell.lab` | **实验版**。多一个「多人游戏」入口，可填服务器地址联机。 |

            两个包名不同，**可以同时安装、互不覆盖**。实验版验证稳定后会合并进正式版。

            ## 怎么用

            1. 安装本 APK
            2. 从上游 `sganggs/Stronghold-Protocol` 的 Releases 下载**完整包**
               （`Stronghold-Protocol-vX.Y.Z.zip`，约 550-820 MB）到手机
            3. 打开启动器 → 点「导入游戏包 (.zip)」→ 选中那个 zip
            4. 等待解压（首次几十秒）→ 点「启动游戏」

            ## 联机怎么玩（仅实验版）

            1. 打开实验版 → 点「🌐 多人游戏（实验）」
            2. 点「＋ 添加服务器」，填一个地址（如 `192.168.1.10:3000`）
            3. 朋友填**同一个地址**，你们就连到了同一个服务器
            4. 进游戏后照常建房 / 加入房间

            **素材从各自手机的本地包读取，公网只传房间同步消息**，所以流量极小。

            ## 为什么这样设计

            - 启动器**不含**任何游戏素材（美术/音频/立绘），合规且体积小
            - 游戏本体来自上游，版权归原作者与鹰角网络
            - **上游更新不用重装启动器**，重新导入新包即可
            - 联机功能与上游解耦：只改 WebSocket 连接目标，不碰游戏包

            ## 校验

            - `${{ steps.apk.outputs.name }}`
              SHA-256: `${{ steps.apk.outputs.sha256 }}`
            - `${{ steps.apk.outputs.lab_name }}`
              SHA-256: `${{ steps.apk.outputs.lab_sha256 }}`

            > 非官方同人作品，游戏素材版权归上海鹰角网络 / Yostar，仅供学习交流、严禁盈利。
          files: out/*.apk
          draft: false
          prerelease: false